<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#120c09" />
  <title>수상한 딜러들 · 정부 경매 위원회</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;800;900&family=Roboto+Slab:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=19" />
</head>
<body data-menu="closed">
  <main id="app">
    <div class="ambient" aria-hidden="true"><i></i><i></i><i></i><span></span></div>
    <section class="loading-state" id="loading-state" role="status" aria-live="polite">
      <span class="loading-seal" aria-hidden="true">H</span>
      <strong id="loading-title">게임 정보를 불러오는 중…</strong>
      <small id="loading-detail">방장이 시작 버튼을 누르면 게임이 시작됩니다.</small>
    </section>

    <header class="hud">
      <span class="hud-ornament" aria-hidden="true"></span>
      <span class="hud-rivets" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div class="brand-lockup">
        <span class="brand-mark">H</span>
        <div><small id="round">ROUND 1/5</small><strong id="phase">비공개 감정</strong></div>
      </div>
      <div class="timer" aria-label="남은 시간"><small>CLOSING</small><strong id="timer">0:20</strong></div>
      <div class="cash"><small>MY PURSE</small><div class="cash-value"><i>₩</i><strong id="cash">$2,000</strong></div></div>
    </header>

    <section class="player-ribbon" id="seats" aria-label="참가자 현황"></section>

    <section class="table-board" aria-hidden="true">
      <div class="table-ring">
        <canvas id="game-board-canvas"></canvas>
        <span class="table-pattern" aria-hidden="true"></span>
      </div>
    </section>

    <section class="lot-stage" id="lot-stage" hidden>
      <div class="lot-stack">
      <article class="lot-card" id="lot-card">
      <div class="lot-card-topline" aria-label="경매 상태">
          <div class="lot-ribbon"><span>AUCTIONEER</span><b id="seller">판매자</b></div>
          <span class="live-chip"><i></i> OPEN</span>
        </div>
      <div class="item-render-wrap" aria-hidden="true">
          <img id="item-image" src="" alt="" />
          <div class="image-vignette"></div>
        </div>
        <div class="lot-copy">
          <div class="lot-meta"><span id="item-era">시대</span><span id="lot-number">출품 01</span></div>
          <h1 id="item-name">황금 보석 알</h1>
          <p id="item-original">Golden Egg</p>
          <div class="bid-panel">
            <div><span>현재 최고 입찰가</span><p class="highest" id="highest">첫 입찰을 기다리는 중</p></div>
            <b id="bid">$100</b>
          </div>
        </div>
       </article>
         <aside class="private-dossier" id="private-dossier" hidden>
           <i class="dossier-roll dossier-roll-left" aria-hidden="true"></i>
           <i class="dossier-roll dossier-roll-right" aria-hidden="true"></i>
           <header><span>PRIVATE LEDGER</span><b>비공개 감정서</b></header>
           <div class="appraisal-value"><small>감정가</small><strong id="true-value">$0</strong></div>
           <div id="clauses"></div>
         </aside>
         <div class="lot-actions" id="lot-actions" hidden></div>
       </div>
     </section>

     <div class="sheet-backdrop" id="sheet-backdrop" aria-hidden="true"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="게임 메뉴 패널">
      <button class="sheet-close" id="sheet-close" type="button" aria-label="패널 닫기">×</button>
      <div class="sheet-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="sheet-scroll" id="sheet-scroll">
        <div id="notice" class="notice">경매장에 연결하는 중…</div>
        <div id="content"></div>
      </div>
    </section>

    <nav class="dock" aria-label="게임 메뉴">
      <span class="dock-rail" aria-hidden="true"></span>
      <button data-tab="items" aria-label="소장품" aria-expanded="false"><span class="dock-icon" aria-hidden="true"></span><em>소장품</em><b id="item-count">0/4</b></button>
      <button data-tab="cards" aria-label="전략패" aria-expanded="false"><span class="dock-icon" aria-hidden="true"></span><em>전략패</em><b id="card-count">0/3</b></button>
      <button data-tab="rules" aria-label="정부" aria-expanded="false"><span class="dock-icon" aria-hidden="true"></span><em>정부</em></button>
    </nav>
  </main>
  <script type="module" src="./game.js?v=18"></script>
</body>
</html>
