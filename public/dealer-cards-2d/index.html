<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#180d0a" />
  <title>수상한 딜러들</title>
  <link rel="stylesheet" href="./styles.css?v=2" />
</head>
<body>
  <main id="app">
    <header class="hud">
      <div class="round-block"><small id="round">ROUND 1/5</small><strong id="phase">판매품 선택</strong></div>
      <div class="timer" id="timer">0:20</div>
      <div class="cash"><small>MY CASH</small><strong id="cash">$2,000</strong></div>
    </header>

    <section class="player-ribbon" id="seats" aria-label="참가자 현황"></section>

    <section class="lot-stage" id="lot-stage" hidden>
      <div class="lot-card">
        <div class="lot-ribbon" id="seller">판매자</div>
        <div class="item-render-wrap"><img id="item-image" src="" alt="" /></div>
        <div class="lot-copy">
          <small id="item-era">시대</small>
          <h1 id="item-name">Golden Egg</h1>
          <div class="bid-line"><span>현재 최고가</span><b id="bid">$100</b></div>
          <p id="highest">첫 입찰을 기다리는 중</p>
        </div>
      </div>
      <aside class="private-dossier" id="private-dossier" hidden>
        <span>PRIVATE APPRAISAL · 나만 보기</span>
        <strong id="true-value">$0</strong>
        <div id="clauses"></div>
      </aside>
    </section>

    <section class="sheet" id="sheet">
      <div id="notice" class="notice">경매장에 연결하는 중…</div>
      <div id="content"></div>
    </section>

    <nav class="dock" aria-label="게임 메뉴">
      <button data-tab="game" class="active"><span>♠</span>경매</button>
      <button data-tab="items"><span>◇</span>아이템 <b id="item-count">0/4</b></button>
      <button data-tab="cards"><span>▣</span>카드 <b id="card-count">0/3</b></button>
      <button data-tab="rules"><span>§</span>규칙</button>
    </nav>
  </main>
  <script type="module" src="./game.js?v=2"></script>
</body>
</html>
