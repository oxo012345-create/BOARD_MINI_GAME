<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>미로의 배달부 — 3D 블록 맵</title>
    <link rel="stylesheet" href="./styles.css?v=20260731-online-mobile-31" />
    <script>
      if (
        new URL(window.location.href).searchParams.get("play") !== "1"
        && sessionStorage.getItem("mazeCourierReady") !== "1"
      ) {
        window.location.replace("./characters.html?select=1");
      }
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="map-shell">
      <canvas id="map-canvas" aria-label="미로의 배달부 3D 블록 맵"></canvas>
      <section class="hud" aria-label="맵 정보">
        <p class="eyebrow">MAP PROTOTYPE 01</p>
        <h1 id="map-title">빙하 연구기지</h1>
        <p id="map-subtitle">밝은 얼음 블록으로 만든 안전한 탐색 맵</p>
      </section>
      <section class="legend" aria-label="맵 범례">
        <span><i class="cyan"></i>중앙 제작대</span>
        <span><i class="yellow"></i>재료 출입구 × 8</span>
      </section>
      <section class="game-status" aria-label="게임 상태">
        <strong id="game-timer">05:00</strong>
        <span>점수 <b id="game-score">0</b></span>
        <button id="audio-toggle" type="button" aria-pressed="false" aria-label="사운드 끄기" title="사운드 켜기/끄기">🔊</button>
      </section>
      <section class="online-status" id="online-status" aria-label="온라인 접속 상태" hidden>
        <span class="connection-dot" id="connection-dot"></span>
        <div>
          <strong id="online-room">온라인 연결 중</strong>
          <span id="online-count">1 / 8명</span>
        </div>
        <button id="copy-room-code" type="button" aria-label="방 코드 복사">복사</button>
      </section>
      <section class="order-panel" aria-label="현재 음식 주문">
        <p>현재 주문 · <b id="recipe-points">2점</b></p>
        <h2 id="recipe-name">치즈 토스트</h2>
        <div id="recipe-ingredients"></div>
        <span id="held-item">손에 든 재료 없음</span>
      </section>
      <section class="map-switcher" aria-label="맵 선택">
        <button type="button" data-map="ice" aria-pressed="true">얼음</button>
        <button type="button" data-map="lava" aria-pressed="false">용암</button>
        <button type="button" data-map="space" aria-pressed="false">우주</button>
      </section>
      <a class="scene-link" href="./characters.html?select=1">캐릭터 변경</a>
      <section class="play-hud" aria-label="캐릭터 조작 안내">
        <strong id="active-character-name">민트 배달부</strong>
        <span>WASD 이동 · 내 주문 재료만 집기 가능</span>
        <span id="active-character-skills">달리기 · 강력 밀치기</span>
        <span class="maze-seed" id="maze-seed">MAP ----</span>
        <button id="reset-player" type="button">입구로 돌아가기</button>
        <button id="regenerate-maze" type="button">새 랜덤 미로</button>
      </section>
      <div class="touch-joystick" id="touch-joystick" aria-label="이동 조이스틱">
        <div class="joystick-knob" id="joystick-knob"></div>
      </div>
      <section class="skill-bar" aria-label="게임 행동과 스킬">
        <button type="button" data-action="interact"><kbd>E</kbd><span>집기·놓기</span></button>
        <button type="button" data-action="push"><kbd>F</kbd><span>밀치기</span><i></i></button>
        <button type="button" data-action="sprint"><kbd>⇧</kbd><span>달리기</span><i></i></button>
        <button type="button" data-action="jump"><kbd>Space</kbd><span>점프</span><i></i></button>
        <button type="button" data-action="fluidize"><kbd>Space</kbd><span>유체화</span><i></i></button>
        <button type="button" data-action="power-push"><kbd>1</kbd><span>강력 밀치기</span><i></i></button>
        <button type="button" data-action="freeze"><kbd>2</kbd><span>급속 냉각</span><i></i></button>
        <button type="button" data-action="swap"><kbd>3</kbd><span>자리 바꾸기</span><i></i></button>
        <button type="button" data-action="oil"><kbd>4</kbd><span>기름칠</span><i></i></button>
      </section>
      <div class="game-message" id="game-message" role="status"></div>
      <div id="loading">3D 맵 불러오는 중…</div>
      <audio id="bgm-audio" preload="none" loop aria-hidden="true"></audio>
    </main>
    <script type="module" src="./map.js?v=20260801-external-realtime-34"></script>
  </body>
</html>
