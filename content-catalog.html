<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>술게임 콘텐츠 카탈로그</title>
  <style>
    :root { color-scheme: dark; --bg:#0d0d12; --card:#191922; --line:#30303c; --ink:#f6f3ff; --muted:#aaa6bb; --hot:#ff5f82; --violet:#9c7cff; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at top,#231934 0,#0d0d12 38%); color:var(--ink); font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; }
    header { position:sticky; top:0; z-index:10; padding:18px 22px; background:#0d0d12e8; backdrop-filter:blur(18px); border-bottom:1px solid var(--line); }
    h1 { margin:0 0 12px; font-size:clamp(22px,4vw,36px); }
    header p { margin:0 0 14px; color:var(--muted); }
    input { width:min(600px,100%); padding:13px 15px; border-radius:12px; border:1px solid var(--line); background:#15151d; color:white; font-size:16px; }
    nav { display:flex; gap:8px; overflow:auto; padding-top:12px; }
    nav a { white-space:nowrap; color:white; text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:8px 12px; font-size:13px; }
    main { width:min(1320px,100%); margin:auto; padding:28px 20px 80px; }
    section { scroll-margin-top:150px; margin:0 0 48px; }
    h2 { font-size:24px; margin:0 0 8px; }
    .meta { color:var(--muted); margin-bottom:18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
    .card { background:linear-gradient(145deg,#1d1d28,#16161e); border:1px solid var(--line); border-radius:15px; padding:14px; min-height:58px; }
    .card b { color:#fff; }
    .card small { color:var(--muted); display:block; margin-top:5px; }
    .pair { display:flex; align-items:center; gap:8px; }
    .pair span { flex:1; text-align:center; border-radius:9px; padding:8px 4px; background:#242430; }
    .pair i { color:var(--hot); font-style:normal; }
    .genre { margin:20px 0 28px; }
    .genre h3 { color:#d8cbff; }
    .quiz strong { color:#ffd06c; }
    .answer { color:#8de5ba; }
    .images { grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
    .image-card { padding:0; overflow:hidden; }
    .photo { height:190px; background:#101016; overflow:hidden; display:grid; place-items:center; position:relative; }
    .photo img { width:100%; height:100%; object-fit:cover; transition:.35s transform; }
    .zoomed img { transform:scale(3.2); }
    .image-card.revealed .zoomed img { transform:scale(1); }
    .photo .loading { color:var(--muted); padding:20px; text-align:center; }
    .caption { padding:12px 14px; }
    .caption a { color:#bba8ff; font-size:12px; }
    .badge { display:inline-block; border-radius:999px; background:#3b2450; color:#f1d8ff; padding:4px 8px; font-size:11px; margin-left:6px; }
    .warning { border:1px solid #72512d; background:#2a2117; color:#ffd99a; padding:14px; border-radius:12px; margin-bottom:18px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <header>
    <h1>술게임 콘텐츠 카탈로그</h1>
    <p>제시어를 검색하고, 사진 퀴즈 이미지를 검수하는 화면입니다.</p>
    <input id="search" type="search" placeholder="예: 떡볶이, ㄷㅂ, 소개팅" />
    <nav id="nav"></nav>
  </header>
  <main id="app"></main>
  <script src="content-data.js"></script>
  <script src="verified-image-data.js"></script>

    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
    async function getJson(url, retries=2) {
      for (let attempt=0; attempt<=retries; attempt++) {
        try {
          const response = await fetch(url);
          if (response.ok) return await response.json();
        } catch {}
        if (attempt < retries) await delay(350 * (attempt + 1));
      }
      return null;
    }
    async function commonsImage(query) {
      query = imageAliases[query] || query;
      const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=420&format=json&origin=*`;
      const json = await getJson(url);
      const page = json.query?.pages ? Object.values(json.query.pages)[0] : null;
      const info = page?.imageinfo?.[0];
      return info ? {src:info.thumburl||info.url, source:info.descriptionurl||`https://commons.wikimedia.org/?curid=${page.pageid}`} : null;
    }
    async function wikiImage(name) {
      if (fixedImages[name]) return fixedImages[name];
      if (noAutoImage.has(name)) return null;
      const fixed = wikiPages[name];
      const query = fixed?.[1] || imageAliases[name] || name;
      const lang = fixed?.[0] || 'ko';
      try {
        const url = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`;
        const json = await getJson(url, 1);
        if (json?.thumbnail?.source) return {src:json.thumbnail.source,source:json.content_urls?.desktop?.page||url};
      } catch {}
      if (fixed) return null;
      return commonsImage(query);
    }
    function imageCard(name, index, zoom=false, mode='wiki') {
      return `<article class="card image-card searchable" data-search="${esc(name)}" data-name="${esc(name)}" data-zoom="${zoom}"><div class="photo ${zoom?'zoomed':''}"><span class="loading">${index+1}. ${esc(name)}<br>사진 불러오는 중…</span></div><div class="caption"><b>${esc(name)}</b><br><a class="source" hidden target="_blank" rel="noreferrer">이미지 원문·사용조건</a></div></article>`;
    }
    async function loadGallery(id, names, mode, zoom=false) {
      const root = document.querySelector(id);
      root.innerHTML = names.map((n,i)=>imageCard(n,i,zoom,mode)).join('');
      const cards = [...root.querySelectorAll('.image-card')];
      let cursor=0;
      async function worker(){
        while(cursor<cards.length){
          const card=cards[cursor++], name=card.dataset.name;
          try {
            const result = mode==='wiki' ? await wikiImage(name) : await commonsImage(name);
            const photo=card.querySelector('.photo');
            if(result){
              photo.innerHTML=`<img alt="${esc(name)}" loading="lazy" src="${esc(result.src)}">`;
              const a=card.querySelector('a.source'); a.href=result.source; a.hidden=false;
            } else photo.innerHTML='<span class="loading">정확한 공개 사진 미확보</span>';
          } catch { card.querySelector('.photo').innerHTML='<span class="loading">사진 불러오기 실패</span>'; }
        }
      }
      await Promise.all([worker(),worker(),worker(),worker()]);
      if(zoom) cards.forEach(card=>card.addEventListener('click',()=>card.classList.toggle('revealed')));
    }
    document.querySelector('#search').addEventListener('input',e=>{
      const q=e.target.value.trim().toLowerCase();
      document.querySelectorAll('.searchable').forEach(el=>el.classList.toggle('hidden',q&&!el.dataset.search.toLowerCase().includes(q)));
    });
    function loadVerifiedGallery(id, items, zoom=false) {
      const root = document.querySelector(id);
      root.innerHTML = items.map((item,index)=>`<article class="card image-card searchable" data-search="${esc(item.answer)}"><div class="photo ${zoom?'zoomed':''}"><img alt="${esc(item.answer)}" loading="lazy" src="${esc(item.url)}"></div><div class="caption"><b>${index+1}. ${esc(item.answer)}</b><br><a class="source" href="${esc(item.source)}" target="_blank" rel="noreferrer">이미지 원문·사용조건</a></div></article>`).join('');
      if (zoom) root.querySelectorAll('.image-card').forEach(card=>card.addEventListener('click',()=>card.classList.toggle('revealed')));
    }
    loadVerifiedGallery('#zoom-images',verifiedImages.zoom,true);
    loadVerifiedGallery('#people-images',verifiedImages.people);
    loadVerifiedGallery('#character-images',verifiedImages.character);
  </script>
</body>
</html>
